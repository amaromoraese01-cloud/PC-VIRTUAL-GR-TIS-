name: Executar PC Virtual

on:
  push:
    branches: [ "principal" ]
  pull_request:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Criar e Executar o PC Virtual
      run: |
        cat << 'EOF' > virtual_machine.py
        class MiniVM:
            def __init__(self):
                self.registers = [0, 0, 0, 0]
                self.ip = 0
                
            def execute(self, program):
                self.ip = 0
                while self.ip < len(program):
                    instruction = program[self.ip]
                    opcode = instruction[0]
                    
                    if opcode == "MOV":
                        _, reg, val = instruction
                        self.registers[reg] = val
                    elif opcode == "ADD":
                        _, reg1, reg2 = instruction
                        self.registers[reg1] += self.registers[reg2]
                    elif opcode == "SUB":
                        _, reg1, reg2 = instruction
                        self.registers[reg1] -= self.registers[reg2]
                    elif opcode == "PRINT":
                        _, reg = instruction
                        print(f"[VM OUTPUT] Registrador R{reg}: {self.registers[reg]}")
                        
                    self.ip += 1

        vm = MiniVM()
        programa = [
            ("MOV", 0, 10),
            ("MOV", 1, 5),
            ("MOV", 2, 3),
            ("ADD", 0, 1),
            ("SUB", 0, 2),
            ("PRINT", 0)
        ]

        print("--- Iniciando a Execução na Máquina Virtual ---")
        vm.execute(programa)
        print("--- Execução Finalizada ---")
        EOF
        
        python virtual_machine.py
